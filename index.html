<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alliance Tracker" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
  <title>Alliance Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The entire app is rendered by app.js into #app -->
  <div id="app">
    <!-- Initial loading splash shown before JS runs -->
    <div id="splash">
      <div class="loader-emblem">⚔</div>
      <div class="loader-title">ALLIANCE TRACKER</div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="modal-overlay" class="modal-overlay hidden"><div id="modal-box" class="modal-box"></div></div>
  <script src="app.js"></script>
</body>
</html>
